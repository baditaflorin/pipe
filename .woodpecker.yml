# Self-hosted Woodpecker. No hosted CI is used for this project.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  test:
    image: golang:1.25@sha256:699337d620559a59b4a2bb298ad59611e535d2ee755a34cf2d2a98f37578dc80
    environment:
      GOFLAGS: -buildvcs=false
    commands:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test -race ./...
